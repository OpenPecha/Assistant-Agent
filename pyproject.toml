[build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "assistant-agent"
version = "0.0.0"
description = ""
authors = ["tenzindelek <tenzdelek>",]
readme = "README.md"
packages = [{ include = "api" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.6"
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic-settings = "^2.6.1"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"
python-jose = "^3.3.0"
pyjwt = "^2.10.0"
requests = "^2.32.3"

[tool.poetry.scripts]
start = "uvicorn:main"

[tool.poetry.dependencies.uvicorn]
extras = [ "standard",]
version = "^0.32.1"
