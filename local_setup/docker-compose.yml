version: "3.8"
services:
  assistant-database:
    image: postgres:16-alpine
    container_name: assistant-database
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=assistantAdmin
      - POSTGRES_DB=assistant
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "5434:5432"
    volumes:
      - ./data/assistant-database:/var/lib/postgresql/data

volumes:
  assistant-database-data:
